# Used only by docker/web.Dockerfile's all-in-one compose stack. Unlike the production
# nginx.conf (apps/web/Dockerfile, separate api domain via VITE_API_URL baked at build time),
# this proxies /api/ to the `api` service so the browser talks to one origin and no CORS
# configuration is needed.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # REST and WebSocket (collab, livesync) both go through here.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Hashed build assets never change, cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Embedded editors (Word/Excel/PowerPoint/PDF) are static apps with their own index.html.
    location /apps/ {
        try_files $uri $uri/ =404;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell; the shell itself must not be cached stale.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
