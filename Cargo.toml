[workspace]
resolver = "3"
exclude = ["vendor"]
members = [
    "modules/collaboration/contracts",
    "modules/collaboration/core",
    "modules/identity/contracts",
    "modules/identity/core",
    "modules/livesync/contracts",
    "modules/livesync/core",
    "apps/api",
    "crates/merge3",
    "crates/platform",
    "crates/shared-kernel",
    "modules/documents/contracts",
    "modules/documents/core",
    "modules/documents/engine",
    "modules/pdfs/contracts",
    "modules/pdfs/core",
    "modules/presentations/contracts",
    "modules/presentations/core",
    "modules/presentations/engine",
    "modules/storage/contracts",
    "modules/storage/core",
    "modules/spreadsheets/contracts",
    "modules/spreadsheets/core",
    "modules/spreadsheets/engine",
    "modules/spreadsheets/engine/wasm",
    "modules/workspace/contracts",
    "modules/workspace/core",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
proptest = "1.12.0"
anyhow = "1.0.104"
dotenvy = "0.15.7"
axum = { version = "0.8.9", features = ["ws"] }
cargo_metadata = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
sha2 = "0.11.1"
redis = { version = "1.8.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "compression-gzip", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
utoipa = { version = "6.0.0", features = ["uuid", "time", "preserve_order"] }

argon2 = "0.6.0"
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30.0"
yrs = "0.28.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
secrecy = "0.10.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros", "json"] }
platform = { path = "crates/platform" }
merge3 = { path = "crates/merge3" }
shared-kernel = { path = "crates/shared-kernel" }
identity-contracts = { path = "modules/identity/contracts" }
identity = { path = "modules/identity/core" }
collaboration-contracts = { path = "modules/collaboration/contracts" }
collaboration = { path = "modules/collaboration/core" }
livesync-contracts = { path = "modules/livesync/contracts" }
livesync = { path = "modules/livesync/core" }
documents-contracts = { path = "modules/documents/contracts" }
documents = { path = "modules/documents/core" }
documents-engine = { path = "modules/documents/engine" }
pdfs-contracts = { path = "modules/pdfs/contracts" }
pdfs = { path = "modules/pdfs/core" }
presentations-contracts = { path = "modules/presentations/contracts" }
presentations = { path = "modules/presentations/core" }
presentations-engine = { path = "modules/presentations/engine" }
storage-contracts = { path = "modules/storage/contracts" }
storage = { path = "modules/storage/core" }
spreadsheets-contracts = { path = "modules/spreadsheets/contracts" }
spreadsheets = { path = "modules/spreadsheets/core" }
spreadsheets-engine = { path = "modules/spreadsheets/engine", default-features = false }
workspace = { path = "modules/workspace/core" }
workspace-contracts = { path = "modules/workspace/contracts" }

# Smaller artifacts: full debug info made target/ grow past 30 GB (every integration test is its
# own binary linking sqlx, yrs and redis). Line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
# Conflicts with rust `unreachable_pub`: items re-exported inside private modules must be `pub(crate)`.
redundant_pub_crate = "allow"

# Browser calculation engine: size over speed of compilation.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
